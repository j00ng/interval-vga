[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "interval-vga"
version = "0.1.0a1"
description = "Height-aware 2.5D visibility graphs using vertical passability intervals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.scripts]
interval-vga-compare = "compare_visibility_edges:main"

[tool.setuptools]
packages = ["interval_vga"]
py-modules = ["visibility_rules", "dxf_semantics", "compare_visibility_edges"]

[tool.unittest]
start-directory = "."
pattern = "test_*.py"
